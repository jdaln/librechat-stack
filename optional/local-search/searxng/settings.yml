use_default_settings:
  engines:
    # Curated engine set (replaces the old "defaults minus ahmia/google/torch").
    # The LibreChat search patch no longer pins engines client-side, so this
    # list is the single source of truth for what gets queried per category.
    # Upstream defaults disable bing/qwant/mojeek (general) for junk/blocking
    # reasons — bing web in particular returns cross-locale trending noise from
    # proxy IPs, which is how off-topic sites leaked into search results.
    # Google stays out: its scraping CAPTCHA-blocks datacenter egress IPs.
    # Startpage proxies Google results, giving similar relevance without the blocks.
    keep_only:
      # general — what returns usable results from this deployment (2026-10-18);
      # DDG's request details are adjusted in patch_engines.py.
      - duckduckgo
      - wikipedia
      # Not included:
      #   startpage, mojeek — require a JavaScript-capable client now
      #   qwant             — the API endpoint used by the engine is unavailable
      #   brave, google     — do not serve automated clients from here
      #   bing              — without an explicit region it picks the market from
      #                       the egress IP (German results for French queries)
      # images
      - duckduckgo images
      - bing images
      # videos
      - duckduckgo videos
      - bing videos
      # news
      - duckduckgo news
      - bing news


general:
  instance_name: "LibreChat Local Search"
  debug: false
  enable_metrics: false
  open_metrics: ""

search:
  safe_search: 1
  # How long an engine stays suspended after an upstream refusal. Upstream
  # defaults are a day for a CAPTCHA; one burst would take DDG away for 24 h.
  suspended_times:
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 300
    SearxEngineAccessDenied: 1800
  # Fallback when query-language detection ('auto') finds nothing, so engines
  # always get an explicit region (searxng/searxng#6779).
  default_lang: "en-US"
  formats:
    - html
    - json

outgoing:
  # 6s (was 4s): requests hop through the squid egress proxy, and the slower
  # quality engines were timing out, leaving fast junk-prone responses to
  # dominate the aggregation.
  request_timeout: 6.0
  # Contact info appended to the "SearXNG/<version>" UA that API engines
  # (wikipedia) send, as Wikimedia's API etiquette asks.
  useragent_suffix: "(+https://github.com/jdaln/librechat-stack)"
  proxies:
    all://:
      - http://egress-proxy:3128

server:
  base_url: http://searxng:8080/
  limiter: true
  image_proxy: false

valkey:
  url: valkey://searxng-valkey:6379/0

ui:
  static_use_hash: true
