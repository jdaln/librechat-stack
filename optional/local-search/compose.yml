volumes:
  searxng_data: {}
  searxng_valkey_data: {}
  jina_reranker_model_cache: {}
  firecrawl_redis_data: {}
  firecrawl_postgres_data: {}

networks:
  search_gateway:
    internal: true
    ipam:
      config:
        - subnet: 172.31.30.0/24
  search:
    internal: true
    ipam:
      config:
        - subnet: 172.31.31.0/24
  searx_internal:
    internal: true
    ipam:
      config:
        - subnet: 172.31.32.0/24
  search_egress:
    internal: true
    ipam:
      config:
        - subnet: 172.31.33.0/24

x-json-logging: &json_logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

x-harden: &harden
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 300
  ulimits:
    nofile: { soft: 1024, hard: 2048 }
  tmpfs:
    - "/tmp:size=1g"
    - "/run:size=500m"

services:
  egress-proxy:
    environment:
      EGRESS_DNS_ENABLE: "1"  #TODO check what we can  do better
      EGRESS_DNS_LISTEN_ADDRESS: 172.31.33.2
    networks:
      lan: {}
      wan: {}
      search_egress:
        ipv4_address: 172.31.33.2

  api:
    depends_on:
      searxng-auth:
        condition: service_started
      firecrawl-api:
        condition: service_healthy
      jina-reranker:
        condition: service_healthy
    networks:
      - lan
      - search_gateway
    environment:
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},searxng-auth,jina-reranker,firecrawl-api
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},searxng-auth,jina-reranker,firecrawl-api
      SEARXNG_INSTANCE_URL: ${SEARXNG_INSTANCE_URL_INTERNAL:-http://searxng-auth:8080}
      SEARXNG_API_KEY: ${SEARXNG_API_KEY:?set SEARXNG_API_KEY in .env}
      LIBRECHAT_WEB_SEARCH_RESULT_COUNT: ${LIBRECHAT_WEB_SEARCH_RESULT_COUNT:-3}
      LIBRECHAT_WEB_SEARCH_MAX_SOURCES: ${LIBRECHAT_WEB_SEARCH_MAX_SOURCES:-2}
      LIBRECHAT_WEB_SEARCH_HIGHLIGHT_COUNT: ${LIBRECHAT_WEB_SEARCH_HIGHLIGHT_COUNT:-2}
      LIBRECHAT_WEB_SEARCH_SOURCE_CHAR_LIMIT: ${LIBRECHAT_WEB_SEARCH_SOURCE_CHAR_LIMIT:-8000}
      LIBRECHAT_WEB_SEARCH_SNIPPET_CHAR_LIMIT: ${LIBRECHAT_WEB_SEARCH_SNIPPET_CHAR_LIMIT:-300}
      LIBRECHAT_WEB_SEARCH_HIGHLIGHT_CHAR_LIMIT: ${LIBRECHAT_WEB_SEARCH_HIGHLIGHT_CHAR_LIMIT:-350}
    logging: *json_logging

  searxng:
    build:
      context: .
      dockerfile: optional/local-search/searxng/Dockerfile
      args:
        SEARXNG_IMAGE: ${SEARXNG_IMAGE:-searxng/searxng:latest@sha256:3eb2fcb2153e0b1f8e9f3457695ed3db1b1443d1dbc2b6d23121835d33fd50aa}
    image: librechat-stack/searxng-runtime:local
    container_name: searxng
    # The service with the broadest outbound allowance gets a write-protected
    # rootfs; its writable paths (cache volume, /tmp, /run) are all covered.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    mem_limit: "512m"
    cpus: "0.75"
    restart: always
    environment:
      SEARXNG_PORT: 8080
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
      SEARXNG_LIMITER: "true"
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      HTTP_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      HTTPS_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      http_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      https_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},searxng,searxng-valkey
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},searxng,searxng-valkey
    volumes:
      - searxng_data:/var/cache/searxng
    tmpfs:
      - "/tmp:size=256m"
      - "/run:size=64m"
    networks:
      searx_internal:
        ipv4_address: 172.31.32.10
      search_egress: {}
    depends_on:
      searxng-valkey:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 5 http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *json_logging

  searxng-auth:
    <<: *harden
    image: caddy:2.11.3-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    container_name: searxng-auth-proxy
    mem_limit: "128m"
    cpus: "0.5"
    cap_add:
      - NET_BIND_SERVICE
    restart: always
    command: ["caddy", "run", "--config", "/run/secrets/searxng_auth_caddyfile", "--adapter", "caddyfile"]
    environment:
      SEARXNG_API_KEY: ${SEARXNG_API_KEY:?set SEARXNG_API_KEY in .env}
    depends_on:
      searxng:
        condition: service_healthy
    networks:
      - search_gateway
      - searx_internal
    volumes:
      - type: volume
        source: stack_secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: searxng-auth
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"
      - "/config:size=16m"
      - "/data:size=16m"
    logging: *json_logging

  searxng-valkey:
    <<: *harden
    image: ${SEARXNG_VALKEY_IMAGE:-valkey/valkey:9.0.4-alpine@sha256:d1cc70645bbcef743615463a2fa4616e841407545e18f560aed0c49671a90147}
    container_name: searxng-valkey
    mem_limit: "128m"
    cpus: "0.25"
    cap_add:
      - SETGID
      - SETUID
    restart: always
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    volumes:
      - searxng_valkey_data:/data
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"
    networks:
      - searx_internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *json_logging

  firecrawl-api:
    <<: *harden
    image: ${FIRECRAWL_IMAGE:-ghcr.io/firecrawl/firecrawl:latest@sha256:6c5049312506841d85e0bc386da34656630645dca867d72e9a33aa01a1f1b519}
    container_name: firecrawl-api
    mem_limit: "3g"
    cpus: "2.0"
    restart: always
    command:
      - /usr/bin/bash
      - -lc
      - |
        set -eu
        trap 'kill -TERM $(jobs -p) 2>/dev/null || true; wait' INT TERM
        node dist/src/index.js &
        api_pid=$$!
        api_ready=0
        startup_attempts="$${FIRECRAWL_API_STARTUP_ATTEMPTS:-1200}"
        for _ in $$(seq 1 "$${startup_attempts}"); do
          if ! kill -0 "$${api_pid}" 2>/dev/null; then
            wait "$${api_pid}"
            exit $$?
          fi
          if (: >/dev/tcp/127.0.0.1/3002) 2>/dev/null; then
            api_ready=1
            break
          fi
          sleep 2
        done
        if [ "$${api_ready}" != "1" ]; then
          echo "Timed out waiting for Firecrawl API to listen on port 3002 after $${startup_attempts} attempts" >&2
          exit 1
        fi
        node dist/src/services/queue-worker.js &
        node dist/src/services/extract-worker.js &
        node dist/src/services/worker/nuq-worker.js &
        wait
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      ENV: local
      FIRECRAWL_API_STARTUP_ATTEMPTS: ${FIRECRAWL_API_STARTUP_ATTEMPTS:-1200}
      HARNESS_STARTUP_TIMEOUT_MS: ${FIRECRAWL_HARNESS_STARTUP_TIMEOUT_MS:-1200000}
      LOGGING_LEVEL: ${FIRECRAWL_LOG_LEVEL:-warn}
      FIRECRAWL_NO_TELEMETRY: ${FIRECRAWL_NO_TELEMETRY:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      HTTP_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      HTTPS_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      http_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      https_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},firecrawl-redis,firecrawl-rabbitmq,firecrawl-postgres,firecrawl-playwright,searxng,searxng-valkey
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},firecrawl-redis,firecrawl-rabbitmq,firecrawl-postgres,firecrawl-playwright,searxng,searxng-valkey
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      # Keep FIRECRAWL_POSTGRES_PASSWORD URL-safe (alphanumeric is simplest);
      # it is embedded in the connection URLs below.
      NUQ_DATABASE_URL: postgresql://postgres:${FIRECRAWL_POSTGRES_PASSWORD:?set FIRECRAWL_POSTGRES_PASSWORD in .env}@firecrawl-postgres:5432/postgres
      NUQ_DATABASE_URL_LISTEN: postgresql://postgres:${FIRECRAWL_POSTGRES_PASSWORD}@firecrawl-postgres:5432/postgres
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD}
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      BULL_AUTH_KEY: ${FIRECRAWL_BULL_AUTH_KEY:?set FIRECRAWL_BULL_AUTH_KEY in .env}
      MAX_CONCURRENT_JOBS: ${FIRECRAWL_MAX_CONCURRENT_JOBS:-1}
      NUM_WORKERS_PER_QUEUE: ${FIRECRAWL_NUM_WORKERS_PER_QUEUE:-1}
      CRAWL_CONCURRENT_REQUESTS: ${FIRECRAWL_CRAWL_CONCURRENT_REQUESTS:-2}
      BROWSER_POOL_SIZE: ${FIRECRAWL_BROWSER_POOL_SIZE:-1}
      NUQ_WORKER_COUNT: ${FIRECRAWL_NUQ_WORKER_COUNT:-1}
      EXTRACT_WORKER_PORT: 3004
      WORKER_PORT: 3005
      USE_DB_AUTHENTICATION: "false"
      PROXY_SERVER: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      PROXY_USERNAME: ""
      PROXY_PASSWORD: ""
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      MODEL_NAME: ""
      MODEL_EMBEDDING_NAME: ""
      OLLAMA_BASE_URL: ""
      SELF_HOSTED_WEBHOOK_URL: ""
      SLACK_WEBHOOK_URL: ""
      SUPABASE_URL: ""
      SUPABASE_ANON_TOKEN: ""
      SUPABASE_SERVICE_TOKEN: ""
      TEST_API_KEY: ""
      SEARXNG_ENDPOINT: ""
      SEARXNG_ENGINES: ""
      SEARXNG_CATEGORIES: ""
    depends_on:
      egress-proxy:
        condition: service_healthy
      firecrawl-redis:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_healthy
    networks:
      - search_gateway
      - search
      - search_egress
    tmpfs:
      - "/tmp:size=1g"
      - "/run:size=128m"
      - "/var/cache/fontconfig:size=128m"
      - "/root/.cache:size=128m"
      - "/root/.fontconfig:size=64m"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec '(: >/dev/tcp/127.0.0.1/3002) 2>/dev/null'"
        ]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 2400s
    logging: *json_logging

  firecrawl-playwright:
    image: ${FIRECRAWL_PLAYWRIGHT_IMAGE:-ghcr.io/firecrawl/playwright-service:latest@sha256:9e0737bc09df28275aab29726b1c0824a7725113945434e843385d487b7f7ec6}
    container_name: firecrawl-playwright
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: "2g"
    cpus: "2.0"
    shm_size: "1g"
    restart: always
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${FIRECRAWL_MAX_CONCURRENT_PAGES:-2}
      FIRECRAWL_NO_TELEMETRY: ${FIRECRAWL_NO_TELEMETRY:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      HTTP_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      HTTPS_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      http_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      https_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},firecrawl-api,firecrawl-redis,firecrawl-rabbitmq,firecrawl-postgres,searxng,searxng-valkey
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},firecrawl-api,firecrawl-redis,firecrawl-rabbitmq,firecrawl-postgres,searxng,searxng-valkey
      BLOCK_MEDIA: ${FIRECRAWL_BLOCK_MEDIA:-}
      PROXY_SERVER: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      PROXY_USERNAME: ""
      PROXY_PASSWORD: ""
    networks:
      - search
      - search_egress
    dns:
      - 172.31.33.2
    depends_on:
      egress-proxy:
        condition: service_healthy
    tmpfs:
      - "/tmp:size=1g"
      - "/run:size=128m"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const s=require('net').connect(3000,'127.0.0.1'); s.setTimeout(5000); s.on('connect',()=>{s.end();process.exit(0)}); s.on('timeout',()=>process.exit(1)); s.on('error',()=>process.exit(1));\""
        ]
      interval: 30s
      timeout: 20s
      retries: 60
      start_period: 600s
    logging: *json_logging

  firecrawl-redis:
    image: ${FIRECRAWL_REDIS_IMAGE:-redis:8.6.3-alpine@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2}
    container_name: firecrawl-redis
    read_only: true
    cap_drop: ["ALL"]
    # Entrypoint drops from root to the redis user.
    cap_add:
      - SETGID
      - SETUID
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    mem_limit: "256m"
    cpus: "0.5"
    restart: always
    command: ["redis-server", "--bind", "0.0.0.0", "--loglevel", "warning", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - firecrawl_redis_data:/data
    tmpfs:
      - "/tmp:size=64m"
      - "/run:size=16m"
    networks:
      - search
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *json_logging

  firecrawl-rabbitmq:
    image: ${FIRECRAWL_RABBITMQ_IMAGE:-rabbitmq:4.3.0-management@sha256:8f3ab1dc6fb3b17ff59ba4e9ceed187c1711a4af831242b733b1e6949625b315}
    container_name: firecrawl-rabbitmq
    cap_drop: ["ALL"]
    # Entrypoint chowns its data/config dirs and drops to the rabbitmq user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt: ["no-new-privileges:true"]
    # Erlang spawns many lightweight processes/threads.
    pids_limit: 1024
    mem_limit: "1g"
    cpus: "1.0"
    restart: always
    environment:
      RABBITMQ_ERLANG_COOKIE: ${FIRECRAWL_RABBITMQ_ERLANG_COOKIE:-local-firecrawl-rabbit-cookie}
    # Queue contents are transient crawl jobs; keep broker state on tmpfs so
    # the writable container layer stays bounded.
    tmpfs:
      - "/var/lib/rabbitmq:size=256m"
      - "/tmp:size=64m"
    networks:
      - search
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 20s
      retries: 60
      start_period: 600s
    logging: *json_logging

  firecrawl-postgres:
    build:
      context: .
      dockerfile: optional/local-search/firecrawl-postgres/Dockerfile
      args:
        FIRECRAWL_POSTGRES_BASE_IMAGE: ${FIRECRAWL_POSTGRES_BASE_IMAGE:-postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641}
        FIRECRAWL_POSTGRES_SCHEMA_IMAGE: ${FIRECRAWL_POSTGRES_SCHEMA_IMAGE:-ghcr.io/firecrawl/nuq-postgres:latest@sha256:f9388bd25ae2e1f1d034518236f993ce236173c1d8800ce24092ea6643a95a33}
    image: librechat-stack/firecrawl-postgres-runtime:local
    container_name: firecrawl-postgres
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Run directly as postgres (mirrors vectordb); the image data dir is
    # postgres-owned so no root setup phase is needed.
    user: "999:999"
    pids_limit: 300
    mem_limit: "1g"
    cpus: "1.0"
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      # NOTE for existing deployments: changing this does not rewrite an
      # already-initialized volume; either reset firecrawl_postgres_data
      # (transient crawl-queue data) or ALTER USER manually.
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?set FIRECRAWL_POSTGRES_PASSWORD in .env}
    volumes:
      - firecrawl_postgres_data:/var/lib/postgresql/data
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"
      - "/var/run/postgresql:size=16m"
    networks:
      - search
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 20s
      retries: 20
      start_period: 180s
    logging: *json_logging

  jina-reranker:
    <<: *harden
    build:
      context: .
      dockerfile: optional/local-search/jina/Dockerfile
      args:
        JINA_RERANKER_BASE_IMAGE: ${JINA_RERANKER_IMAGE:-librechat-jina-reranker:da638699-tiny-en}
    image: librechat-stack/jina-reranker-runtime:local
    container_name: jina-reranker
    mem_limit: "1g"
    cpus: "1.0"
    restart: always
    # No env_file: a third-party image only needs the variables listed below,
    # not the full .env secret set.
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      MODEL_NAME: ${JINA_RERANKER_MODEL_NAME:-jinaai/jina-reranker-v1-tiny-en}
      CACHE_DIR: /app/.cache
      TOKENIZERS_PARALLELISM: "false"
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      OMP_NUM_THREADS: ${JINA_RERANKER_OMP_NUM_THREADS:-1}
      JINA_RERANKER_LOAD_MODEL: ${JINA_RERANKER_LOAD_MODEL:-0}
      JINA_RERANKER_MAX_BATCH_SIZE: ${JINA_RERANKER_MAX_BATCH_SIZE:-2}
      JINA_RERANKER_LOG_LEVEL: ${JINA_RERANKER_LOG_LEVEL:-WARNING}
    volumes:
      - jina_reranker_model_cache:/app/.cache
    tmpfs:
      - "/tmp:size=512m"
      - "/run:size=64m"
    networks:
      - search_gateway
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1)\""
        ]
      interval: 30s
      timeout: 60s
      retries: 30
      start_period: 600s
    logging: *json_logging
