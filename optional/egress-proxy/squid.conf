# Explicit egress proxy policy for LibreChat services.
# API/RAG use this proxy via HTTP(S)_PROXY and only allowlisted domains pass.

http_port 3128

# Keep this as a policy gateway, not a cache.
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB

# Reduce source leakage.
pinger_enable off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Forwarded deny all

# Destination allowlist (domains in optional/egress-proxy/allowed_domains.txt).
acl allowed_domains dstdomain "/run/secrets/squid_allowlist"
# Vertex AI regional endpoints follow LOCATION-aiplatform.googleapis.com.
# CONNECT checks may include ":443", so allow optional port suffix.
acl allowed_vertex_regional dstdom_regex -i ^[a-z0-9-]+-aiplatform\.googleapis\.com(:[0-9]+)?$
# Local-search overlay egress network (optional/local-search/compose.yml).
# These clients are allowed outbound web access, but all requests are audited.
acl search_clients src 172.31.33.0/24
# Never let the proxy become an SSRF bridge into local, Docker, link-local,
# private, multicast, reserved, or documentation networks.
acl blocked_dst dst 0.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.0.0.0/24
acl blocked_dst dst 192.0.2.0/24
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 198.18.0.0/15
acl blocked_dst dst 198.51.100.0/24
acl blocked_dst dst 203.0.113.0/24
acl blocked_dst dst 224.0.0.0/4
acl blocked_dst dst 240.0.0.0/4
acl blocked_dst dst ::1/128
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10
acl blocked_dstdomain dstdomain localhost .local .internal

# Restrict ports/methods.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_dst
http_access deny blocked_dstdomain

# Allow only explicit destinations.
# Local-search clients need arbitrary web access to fetch result pages.
# Keep them auditable while enforcing strict policy for all other clients.
http_access allow search_clients
http_access allow allowed_vertex_regional
http_access allow allowed_domains
http_access deny all

# Audit all local-search proxy traffic, plus denied traffic from other clients.
# Written to a fifo the entrypoint forwards to container stdout, so the lines
# reach `docker logs` and the json-file rotation. (Squid cannot write to
# /dev/stdout directly: it drops to the proxy user, which cannot reopen the
# root-owned stdout pipe. A tmpfs access.log was unbounded-by-crawl, lost on
# restart, and invisible to standard tooling.)
access_log stdio:/run/squid-access.pipe search_clients
access_log stdio:/run/squid-access.pipe !search_clients !allowed_vertex_regional !allowed_domains
cache_log /dev/null
cache_store_log none
