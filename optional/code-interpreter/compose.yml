volumes:
  code_interpreter_sandbox_data: {}
  code_interpreter_redis_data: {}
  code_interpreter_minio_data: {}

networks:
  code_interpreter:
    internal: true
    ipam:
      config:
        - subnet: 172.31.20.0/24
  code_gateway:
    internal: true
    ipam:
      config:
        - subnet: 172.31.21.0/24

x-json-logging: &json_logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

x-harden: &harden
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 300
  ulimits:
    nofile: { soft: 1024, hard: 2048 }
  tmpfs:
    - "/tmp:size=1g"
    - "/run:size=500m"

services:
  api:
    depends_on:
      code-interpreter-proxy:
        condition: service_healthy
    environment:
      LIBRECHAT_CODE_BASEURL: ${LIBRECHAT_CODE_BASEURL:-http://code-interpreter-api:8000}
      LIBRECHAT_CODE_API_KEY: ${LIBRECHAT_CODE_API_KEY:-local-code-interpreter-key-change-me}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},code-interpreter-api,code-interpreter-proxy
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy},code-interpreter-api,code-interpreter-proxy
    networks:
      - code_gateway
    logging: *json_logging

  code-interpreter-proxy:
    <<: *harden
    image: caddy:2.11.3-alpine
    container_name: code-interpreter-proxy
    restart: always
    cap_add:
      - NET_BIND_SERVICE
    command:
      - caddy
      - reverse-proxy
      - --from
      - http://:8000
      - --to
      - http://code-interpreter-backend:8000
    depends_on:
      code-interpreter-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CODE_INTERPRETER_PORT:-8001}:8000"
    networks:
      ingress: {}
      code_interpreter: {}
      code_gateway:
        aliases:
          # Preserve existing LIBRECHAT_CODE_BASEURL values that point at
          # http://code-interpreter-api:8000.
          - code-interpreter-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 45 http://127.0.0.1:8000/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 10s
    mem_limit: "128m"
    cpus: "0.5"
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"
      - "/config:size=16m"
      - "/data:size=16m"
    logging: *json_logging

  code-interpreter-api:
    image: ${CODE_INTERPRETER_IMAGE:-librecodeinterpreter:170194f}
    container_name: code-interpreter-api
    restart: always
    init: true
    command:
      - /bin/sh
      - -lc
      - |
        mkdir -p /app/ssl /run/lock /tmp/empty_proc
        python3 - <<'PY'
        import socket
        import sys
        import time

        targets = [
            ("code-interpreter-redis", 6379),
            ("code-interpreter-minio", 9000),
        ]
        deadline = time.monotonic() + 120

        while True:
            pending = []
            for host, port in targets:
                try:
                    with socket.create_connection((host, port), timeout=2):
                        pass
                except OSError as exc:
                    pending.append(f"{host}:{port} ({exc})")

            if not pending:
                break

            if time.monotonic() >= deadline:
                print("Timed out waiting for code-interpreter dependencies: " + ", ".join(pending), file=sys.stderr)
                sys.exit(1)

            time.sleep(2)
        PY
        exec python3 -m src.main
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
      # Required for current LibreCodeInterpreter/nsjail runtime.
      - apparmor:unconfined
    pids_limit: 512
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    mem_limit: "2g"
    cpus: "2.0"
    env_file:
      - .env
    environment:
      API_KEY: ${LIBRECHAT_CODE_API_KEY:-local-code-interpreter-key-change-me}
      REDIS_HOST: code-interpreter-redis
      REDIS_PORT: 6379
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      S3_ENDPOINT: code-interpreter-minio:9000
      S3_ACCESS_KEY: ${CODE_INTERPRETER_MINIO_ACCESS_KEY:-change-me-minio-user}
      S3_SECRET_KEY: ${CODE_INTERPRETER_MINIO_SECRET_KEY:-change-me-minio-password}
      S3_BUCKET: ${CODE_INTERPRETER_MINIO_BUCKET:-code-interpreter-files}
      S3_SECURE: "false"
      MINIO_ENDPOINT: code-interpreter-minio:9000
      MINIO_ACCESS_KEY: ${CODE_INTERPRETER_MINIO_ACCESS_KEY:-change-me-minio-user}
      MINIO_SECRET_KEY: ${CODE_INTERPRETER_MINIO_SECRET_KEY:-change-me-minio-password}
      MINIO_BUCKET: ${CODE_INTERPRETER_MINIO_BUCKET:-code-interpreter-files}
      MINIO_SECURE: "false"
      PORT: 8000
      ENABLE_HTTPS: "false"
      LOG_LEVEL: ${CODE_INTERPRETER_LOG_LEVEL:-WARNING}
      REPL_ENABLED: ${CODE_INTERPRETER_REPL_ENABLED:-false}
      SANDBOX_POOL_ENABLED: ${CODE_INTERPRETER_SANDBOX_POOL_ENABLED:-false}
    volumes:
      - code_interpreter_sandbox_data:/var/lib/code-interpreter/sandboxes
    tmpfs:
      - /app/data:size=100m
      - /tmp:size=1g
      - /run:size=128m
    depends_on:
      code-interpreter-redis:
        condition: service_healthy
      code-interpreter-minio-init:
        condition: service_completed_successfully
    networks:
      code_interpreter:
        aliases:
          - code-interpreter-backend
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 45 -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 30s
      timeout: 60s
      retries: 30
      start_period: 300s
    logging: *json_logging

  code-interpreter-redis:
    image: redis:8.6.3-alpine
    container_name: code-interpreter-redis
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    mem_limit: "256m"
    cpus: "0.5"
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --loglevel warning
      --maxmemory-policy allkeys-lru
    volumes:
      - code_interpreter_redis_data:/data
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"
    networks:
      - code_interpreter
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *json_logging

  code-interpreter-minio:
    <<: *harden
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: code-interpreter-minio
    mem_limit: "512m"
    cpus: "0.75"
    cap_add:
      - NET_BIND_SERVICE
    restart: always
    environment:
      MINIO_ROOT_USER: ${CODE_INTERPRETER_MINIO_ACCESS_KEY:-change-me-minio-user}
      MINIO_ROOT_PASSWORD: ${CODE_INTERPRETER_MINIO_SECRET_KEY:-change-me-minio-password}
    command: server /data --console-address ":9001"
    volumes:
      - code_interpreter_minio_data:/data
    tmpfs:
      - "/tmp:size=256m"
      - "/run:size=64m"
      - "/root/.minio:rw,size=32m"
    networks:
      - code_interpreter
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s
    logging: *json_logging

  code-interpreter-minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: code-interpreter-minio-init
    depends_on:
      code-interpreter-minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://code-interpreter-minio:9000 $${CODE_INTERPRETER_MINIO_ACCESS_KEY:-change-me-minio-user} $${CODE_INTERPRETER_MINIO_SECRET_KEY:-change-me-minio-password};
      mc mb --ignore-existing local/$${CODE_INTERPRETER_MINIO_BUCKET:-code-interpreter-files};
      exit 0;
      "
    environment:
      CODE_INTERPRETER_MINIO_ACCESS_KEY: ${CODE_INTERPRETER_MINIO_ACCESS_KEY:-change-me-minio-user}
      CODE_INTERPRETER_MINIO_SECRET_KEY: ${CODE_INTERPRETER_MINIO_SECRET_KEY:-change-me-minio-password}
      CODE_INTERPRETER_MINIO_BUCKET: ${CODE_INTERPRETER_MINIO_BUCKET:-code-interpreter-files}
    networks:
      - code_interpreter
    logging: *json_logging
