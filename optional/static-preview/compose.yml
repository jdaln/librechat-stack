x-json-logging: &json_logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

x-harden: &harden
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 300
  ulimits:
    nofile: { soft: 1024, hard: 2048 }
  tmpfs:
    - "/tmp:size=1g"
    - "/run:size=500m"

networks:
  static_preview_net:
    internal: true
    ipam:
      config:
        - subnet: 172.31.40.0/24

services:
  static_preview:
    <<: *harden
    build:
      context: ./optional/static-preview
      dockerfile: Dockerfile.sandpack-static
    image: librechat/static-preview:local
    pull_policy: never
    container_name: sandpack-static
    user: "1000:1000"
    mem_limit: "512m"
    cpus: "0.5"
    networks: [static_preview_net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4324/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 300s
    logging: *json_logging

  caddy:
    <<: *harden
    image: caddy:2.11.3-alpine
    container_name: caddy-static-proxy
    mem_limit: "128m"
    cpus: "0.5"
    cap_add:
      - NET_BIND_SERVICE
    command: ["caddy", "run", "--config", "/run/secrets/static_preview_caddyfile", "--adapter", "caddyfile"]
    depends_on:
      static_preview:
        condition: service_healthy
    # Expose localhost HTTP proxy (CORS enabled) for browser preview fetches.
    ports:
      - "127.0.0.1:4324:80"
    networks:
      - ingress
      - static_preview_net
    volumes:
      - type: volume
        source: stack_secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: static-preview
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"
      - "/config:size=16m"
      - "/data:size=16m"
    restart: always
    logging: *json_logging
