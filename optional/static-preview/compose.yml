services:
  static_preview:
    build:
      context: ./optional/static-preview
      dockerfile: Dockerfile.sandpack-static
    image: librechat/static-preview:local
    container_name: sandpack-static
    networks: [lan, wan]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4324/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2.8-alpine
    container_name: caddy-static-proxy
    depends_on:
      static_preview:
        condition: service_healthy
    # Expose localhost HTTP proxy (CORS enabled) for browser preview fetches.
    ports:
      - "127.0.0.1:4324:80"
    networks:
      - wan
      - lan
    secrets:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    restart: always

secrets:
  caddyfile:
    file: ./optional/static-preview/Caddyfile
