services:
  static_preview:
    build:
      context: .
      dockerfile: Dockerfile.sandpack-static
    image: librechat/static-preview:local
    container_name: sandpack-static
    # Do NOT publish to host; Caddy fronts it on 443
    networks: [lan, wan]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4324/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2.8-alpine
    container_name: caddy-static-proxy
    depends_on:
      static_preview:
        condition: service_healthy
    # expose HTTPS to your Mac only
    ports:
      - "127.0.0.1:443:443"
    networks:
      - wan
      - lan
    secrets:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
      - source: tls_cert
        target: /run/secrets/tls_cert
      - source: tls_key
        target: /run/secrets/tls_key
    restart: always

secrets:
  caddyfile:
    file: ./Caddyfile
  tls_cert:
    file: ../secrets/sslip.crt
  tls_key:
    file: ../secrets/sslip.key
