# NOTE: the api container reads this file from the stack secrets volume, not
# from the repo. After editing, re-run scripts/populate_stack_secrets_volume.sh
# (or scripts/start_stack.sh) and restart the api container to apply changes.
# template_librechat.yaml is the fuller reference (includes the Vertex/google
# preset); keep intentional differences between the two minimal.
version: 1.3.3
cache: true
fileStrategy: "local"
secureImageLinks: true

interface:
  customWelcome: "LibreChat — local-only inference via host Ollama."
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  webSearch: true
  # File search needs the optional `embeddings` overlay (or a real
  # OpenAI key) — see optional/embeddings/ + docs/egress-policy.md.
  fileSearch: true
  fileCitations: true

# Distinct `open_url` fetch tool for Agents (weak models ignore the url param
# on web_search but reliably call a separately-named tool). The server is a
# single stdio script baked into the api image; it fetches through Firecrawl,
# so egress policy and auditing apply unchanged.
mcpServers:
  browser:
    type: stdio
    command: node
    args:
      - /app/mcp/open-url.cjs
    timeout: 60000
    # stdio children get a minimal env, not the container's; pass what the
    # script needs explicitly.
    env:
      FIRECRAWL_API_URL: "${FIRECRAWL_API_URL}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"
      LIBRECHAT_WEB_SEARCH_FETCH_CHAR_LIMIT: "${LIBRECHAT_WEB_SEARCH_FETCH_CHAR_LIMIT}"

webSearch:
  searchProvider: searxng
  scraperProvider: firecrawl
  rerankerType: jina
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searxngApiKey: "${SEARXNG_API_KEY}"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  firecrawlVersion: "${FIRECRAWL_VERSION}"
  firecrawlOptions:
    formats:
      - markdown
    onlyMainContent: true
    blockAds: true
    removeBase64Images: true
  jinaApiKey: "${JINA_API_KEY}"
  jinaApiUrl: "${JINA_API_URL}"
  # 15s: 7s aborted slower pages mid-scrape (JS-heavy sites via the playwright
  # engine), so the model saw failed sources and retried in loops.
  scraperTimeout: 15000
  safeSearch: 1

endpoints:
  agents:
    allowedProviders:
      - Ollama
      - TensorX
    capabilities:
      - tools
      - execute_code
      - artifacts
      - web_search
      - file_search
      - actions
      - context
      - chain
      - ocr
  custom:
    # Ollama on the host, bridged via the `ollama-proxy` container (enable
    # the overlay with ENABLE_OLLAMA=1). The proxy lives on the internal `lan`
    # network and forwards requests to host.docker.internal:11434. Ollama is
    # OpenAI-compatible at /v1, so this is a standard custom-endpoint entry.
    - name: "Ollama"
      # Ollama doesn't enforce auth; any non-empty string works. The proxy
      # is only reachable from inside the stack, so there's nothing to
      # authenticate against the world.
      apiKey: "ollama"
      baseURL: "http://ollama-proxy:11434/v1"
      modelDisplayLabel: "Ollama"
      titleConvo: true
      titleMethod: "completion"
      titleModel: "current_model"
      models:
        # `fetch: true` queries /v1/models on the proxy and surfaces every
        # model the host's Ollama daemon has pulled. Add new models with
        # `ollama pull <name>` on the host; they appear here automatically.
        # The default below is the fallback shown when fetch fails (e.g.
        # ollama-proxy not yet healthy on first boot).
        default:
          - "gemma4:31b-mlx"
          - "gemma4:26b-mlx"
          - "gemma4:12b-mlx"
          - "gemma4:e4b-mlx"
          - "gemma4:e2b-mlx"
          - "qwen3.6:27b-mlx"
          - "mistral-nemo:12b"
          - "granite4.1:8b"
          - "olmo-3:7b-think"
          - "olmo-3:7b-instruct"
        fetch: true

    # TensorX — OpenAI-compatible cloud endpoint. Reaches the internet via the
    # egress-proxy allowlist, so `.tensorx.ai` must be present in
    # optional/egress-proxy/allowed_domains.txt (added). The API key lives in
    # .env as TENSORX_API_KEY and is injected here at runtime.
    - name: "TensorX"
      apiKey: "${TENSORX_API_KEY}"
      baseURL: "https://api.tensorx.ai/v1"
      modelDisplayLabel: "TensorX"
      titleConvo: true
      titleMethod: "completion"
      titleModel: "deepseek/deepseek-v4-flash-0731"
      models:
        # `fetch: true` queries /v1/models once a real key is set; the default
        # keeps DeepSeek V4 Flash selectable on first boot.
        default:
          - "deepseek/deepseek-v4-flash-0731"
        fetch: true

modelSpecs:
  enforce: false
  prioritize: false
  list:
    # Cloud endpoint via TensorX (requires TENSORX_API_KEY in .env).
    - name: "tensorx-deepseek-v4-flash-0731"
      label: "DeepSeek V4 Flash (TensorX)"
      default: false
      description: "DeepSeek V4 Flash via TensorX cloud API. 1M context, OpenAI-compatible. Requires TENSORX_API_KEY."
      # Default-on capabilities for new conversations with this spec: web
      # search (includes direct url fetch), code interpreter, and the local
      # `browser` MCP server (open_url). The badges stay user-toggleable.
      webSearch: true
      executeCode: true
      mcpServers:
        - "browser"
      preset:
        endpoint: "TensorX"
        model: "deepseek/deepseek-v4-flash-0731"
        temperature: 1.0
        greeting: "DeepSeek V4 Flash preset is active via TensorX.\n"
    # All five presets are Apple-MLX builds of Gemma 4, pulled into the
    # host Ollama. Pull on the host with:
    #   ollama pull gemma4:<size>-mlx
    # The default is gemma4:31b-mlx — top quality, ~20GB on disk, requires
    # roughly the same in unified memory on Apple Silicon.
    - name: "ollama-gemma4-31b"
      label: "Gemma 4 31B MLX (Ollama)"
      default: false
      description: "Local Gemma 4 31B via host Ollama (Apple MLX). 20GB, 256K context. Highest quality of the local set."
      preset:
        endpoint: "Ollama"
        model: "gemma4:31b-mlx"
        temperature: 1.0
        greeting: "Gemma 4 31B MLX preset is active via host Ollama.\n"
    - name: "ollama-gemma4-26b"
      label: "Gemma 4 26B MLX (Ollama)"
      default: false
      description: "Local Gemma 4 26B via host Ollama (Apple MLX). 17GB, 256K context."
      preset:
        endpoint: "Ollama"
        model: "gemma4:26b-mlx"
        temperature: 1.0
        greeting: "Gemma 4 26B MLX preset is active via host Ollama.\n"
    - name: "ollama-gemma4-12b"
      label: "Gemma 4 12B MLX (Ollama)"
      default: true
      description: "Local Gemma 4 12B via host Ollama (Apple MLX). 6.8GB, 256K context — good speed/quality balance."
      preset:
        endpoint: "Ollama"
        model: "gemma4:12b-mlx"
        temperature: 1.0
        greeting: "Gemma 4 12B MLX preset is active via host Ollama.\n"
    - name: "ollama-gemma4-e4b"
      label: "Gemma 4 E4B MLX (Ollama)"
      default: false
      description: "Local Gemma 4 E4B via host Ollama (Apple MLX). 9.6GB, 128K context — efficient sub-12B option."
      preset:
        endpoint: "Ollama"
        model: "gemma4:e4b-mlx"
        temperature: 1.0
        greeting: "Gemma 4 E4B MLX preset is active via host Ollama.\n"
    - name: "ollama-gemma4-e2b"
      label: "Gemma 4 E2B MLX (Ollama)"
      default: false
      description: "Local Gemma 4 E2B via host Ollama (Apple MLX). 7.1GB, 128K context — fastest, lowest memory."
      preset:
        endpoint: "Ollama"
        model: "gemma4:e2b-mlx"
        temperature: 1.0
        greeting: "Gemma 4 E2B MLX preset is active via host Ollama.\n"
    # Other local families pulled into the host Ollama. Pull on the host
    # with `ollama pull <name>` before selecting these.
    - name: "ollama-qwen36-27b"
      label: "Qwen 3.6 27B MLX (Ollama)"
      default: false
      description: "Local Qwen 3.6 27B via host Ollama (Apple MLX). 19GB. Strong reasoning/coding."
      preset:
        endpoint: "Ollama"
        model: "qwen3.6:27b-mlx"
        temperature: 1.0
        greeting: "Qwen 3.6 27B MLX preset is active via host Ollama.\n"
    - name: "ollama-mistral-nemo-12b"
      label: "Mistral Nemo 12B (Ollama)"
      default: false
      description: "Local Mistral Nemo 12B via host Ollama. 7.1GB. General-purpose, good multilingual."
      preset:
        endpoint: "Ollama"
        model: "mistral-nemo:12b"
        temperature: 0.3
        greeting: "Mistral Nemo 12B preset is active via host Ollama.\n"
    - name: "ollama-granite41-8b"
      label: "Granite 4.1 8B (Ollama)"
      default: false
      description: "Local IBM Granite 4.1 8B via host Ollama. 5.3GB. Enterprise/instruction-tuned."
      preset:
        endpoint: "Ollama"
        model: "granite4.1:8b"
        temperature: 0.0
        greeting: "Granite 4.1 8B preset is active via host Ollama.\n"
    - name: "ollama-olmo3-7b-think"
      label: "OLMo 3 7B Think (Ollama)"
      default: false
      description: "Local OLMo 3 7B (reasoning/think variant) via host Ollama. 4.5GB. Fully open model."
      preset:
        endpoint: "Ollama"
        model: "olmo-3:7b-think"
        temperature: 0.6
        greeting: "OLMo 3 7B Think preset is active via host Ollama.\n"
    - name: "ollama-olmo3-7b-instruct"
      label: "OLMo 3 7B Instruct (Ollama)"
      default: false
      description: "Local OLMo 3 7B (instruct variant) via host Ollama. 4.5GB. Fully open model."
      preset:
        endpoint: "Ollama"
        model: "olmo-3:7b-instruct"
        temperature: 0.6
        greeting: "OLMo 3 7B Instruct preset is active via host Ollama.\n"

actions:
  allowedDomains:
    - 'opencode.ai'
    - 'librechat.ai'
