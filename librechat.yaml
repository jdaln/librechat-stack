# NOTE: the api container reads this file from the stack secrets volume, not
# from the repo. After editing, re-run scripts/populate_stack_secrets_volume.sh
# (or scripts/start_stack.sh) and restart the api container to apply changes.
# template_librechat.yaml is the fuller reference (includes the Vertex/google
# preset); keep intentional differences between the two minimal.
version: 1.3.3
cache: true
fileStrategy: "local"
secureImageLinks: true

interface:
  customWelcome: "LibreChat running on hardened Docker with OpenRouter and OpenCode presets."
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  webSearch: true
  fileSearch: false
  fileCitations: false

webSearch:
  searchProvider: searxng
  scraperProvider: firecrawl
  rerankerType: jina
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searxngApiKey: "${SEARXNG_API_KEY}"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  firecrawlVersion: "${FIRECRAWL_VERSION}"
  firecrawlOptions:
    formats:
      - markdown
    onlyMainContent: true
    blockAds: true
    removeBase64Images: true
  jinaApiKey: "${JINA_API_KEY}"
  jinaApiUrl: "${JINA_API_URL}"
  scraperTimeout: 7000
  safeSearch: 1

endpoints:
  agents:
    allowedProviders:
      - openAI
      - OpenRouter
    capabilities:
      - tools
      - execute_code
      - artifacts
      - web_search
      - file_search
      - actions
      - context
      - chain
      - ocr
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      modelDisplayLabel: "OpenRouter"
      titleConvo: true
      titleModel: "google/gemma-4-31b-it:free"
      models:
        default:
          - "google/gemma-4-31b-it:free"
        # Auto-populate the full model list from OpenRouter when a real key is
        # set (prevents the list from going stale); the default above keeps a
        # verified free model selectable even when fetch fails on a placeholder key.
        fetch: true

modelSpecs:
  enforce: false
  prioritize: false
  list:
    - name: "opencode-nemotron-ultra-free"
      label: "Nemotron 3 Ultra Free (OpenCode Zen)"
      default: true
      description: "Free OpenCode Zen model; works with the shared `public` OPENAI_API_KEY."
      preset:
        endpoint: "openAI"
        model: "nemotron-3-ultra-free"
        temperature: 0.2
        greeting: "Nemotron 3 Ultra Free preset is active via OpenCode Zen (no key required).\n"
    - name: "opencode-deepseek-flash-free"
      label: "DeepSeek V4 Flash Free (OpenCode Zen)"
      default: false
      description: "Free OpenCode Zen model; works with the shared `public` OPENAI_API_KEY."
      preset:
        endpoint: "openAI"
        model: "deepseek-v4-flash-free"
        temperature: 0.2
        greeting: "DeepSeek V4 Flash Free preset is active via OpenCode Zen (no key required).\n"
    - name: "openrouter-gemma-free"
      label: "Gemma 4 31B Free (OpenRouter)"
      default: false
      description: "Free OpenRouter model; set OPENROUTER_API_KEY (free tier works)."
      preset:
        endpoint: "OpenRouter"
        model: "google/gemma-4-31b-it:free"
        temperature: 0.2
        greeting: "Gemma 4 31B Free preset is active via OpenRouter.\n"
    - name: "opencode-claude-fable-5"
      label: "Claude Fable 5 (OpenCode Zen — paid key)"
      default: false
      description: "Premium OpenCode Zen model; requires a real OPENAI_API_KEY (the public key only lists models)."
      preset:
        endpoint: "openAI"
        model: "claude-fable-5"
        temperature: 0.2
        greeting: "Claude Fable 5 preset is active via OpenCode Zen. Requires a paid OpenCode key.\n"

actions:
  allowedDomains:
    - 'opencode.ai'
    - 'librechat.ai'
