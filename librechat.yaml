# NOTE: the api container reads this file from the stack secrets volume, not
# from the repo. After editing, re-run scripts/populate_stack_secrets_volume.sh
# (or scripts/start_stack.sh) and restart the api container to apply changes.
# template_librechat.yaml is the fuller reference (includes the Vertex/google
# preset); keep intentional differences between the two minimal.
version: 1.3.3
cache: true
fileStrategy: "local"
secureImageLinks: true

interface:
  customWelcome: "LibreChat running on hardened Docker with OpenRouter and OpenCode presets."
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  webSearch: true
  fileSearch: false
  fileCitations: false

webSearch:
  searchProvider: searxng
  scraperProvider: firecrawl
  rerankerType: jina
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searxngApiKey: "${SEARXNG_API_KEY}"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  firecrawlVersion: "${FIRECRAWL_VERSION}"
  firecrawlOptions:
    formats:
      - markdown
    onlyMainContent: true
    blockAds: true
    removeBase64Images: true
  jinaApiKey: "${JINA_API_KEY}"
  jinaApiUrl: "${JINA_API_URL}"
  scraperTimeout: 7000
  safeSearch: 1

endpoints:
  agents:
    allowedProviders:
      - openAI
      - OpenRouter
    capabilities:
      - tools
      - execute_code
      - artifacts
      - web_search
      - file_search
      - actions
      - context
      - chain
      - ocr
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      modelDisplayLabel: "OpenRouter"
      titleConvo: true
      titleModel: "arcee-ai/trinity-large-preview:free"
      models:
        default:
          - "arcee-ai/trinity-large-preview:free"
        fetch: false

modelSpecs:
  enforce: false
  prioritize: false
  list:
    - name: "openrouter-trinity-large-free"
      label: "Trinity Large Free (OpenRouter)"
      default: false
      description: "Working free OpenRouter preset validated against the current key."
      preset:
        endpoint: "OpenRouter"
        model: "arcee-ai/trinity-large-preview:free"
        temperature: 0.2
        greeting: "Trinity Large Free preset is active via OpenRouter.\n"
    - name: "minimax-m2-5-free"
      label: "MiniMax M2.5 Free (OpenCode Zen)"
      default: true
      description: "OpenCode Zen free MiniMax preset with lower rate-limit pressure than Big Pickle."
      preset:
        endpoint: "openAI"
        model: "minimax-m2.5-free"
        temperature: 0.2
        greeting: "MiniMax M2.5 Free preset is active via OpenCode Zen.\n"
    - name: "big-pickle-default"
      label: "Big Pickle (OpenCode Zen)"
      default: false
      description: "OpenCode Zen test preset"
      preset:
        endpoint: "openAI"
        model: "big-pickle"
        temperature: 0.2
        greeting: |
          Big Pickle test preset is active. Add your OpenCode API key in .env to run live prompts.

actions:
  allowedDomains:
    - 'opencode.ai'
    - 'librechat.ai'
