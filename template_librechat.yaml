# Reference template for librechat.yaml (superset: includes the Vertex/google
# preset). The live file is served to the api container from the stack secrets
# volume - after editing librechat.yaml, re-run the populate script and restart
# the api container.
version: 1.3.3
cache: true
fileStrategy: "local"
secureImageLinks: true

interface:
  customWelcome: "LibreChat running on hardened Docker with OpenRouter and OpenCode presets."
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  webSearch: true
  fileSearch: false
  fileCitations: false

webSearch:
  searchProvider: searxng
  scraperProvider: firecrawl
  rerankerType: jina
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searxngApiKey: "${SEARXNG_API_KEY}"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  firecrawlVersion: "${FIRECRAWL_VERSION}"
  firecrawlOptions:
    formats:
      - markdown
    onlyMainContent: true
    blockAds: true
    removeBase64Images: true
  jinaApiKey: "${JINA_API_KEY}"
  jinaApiUrl: "${JINA_API_URL}"
  scraperTimeout: 7000
  safeSearch: 1

endpoints:
  agents:
    allowedProviders:
      - openAI
      - google
      - OpenRouter
    capabilities:
      - tools
      - execute_code
      - artifacts
      - web_search
      - file_search
      - actions
      - context
      - chain
      - ocr
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      modelDisplayLabel: "OpenRouter"
      titleConvo: true
      titleModel: "google/gemma-4-31b-it:free"
      models:
        default:
          - "google/gemma-4-31b-it:free"
        # Auto-populate from OpenRouter when a real key is set; the default
        # above keeps a verified free model usable on a placeholder key.
        fetch: true

modelSpecs:
  enforce: false
  prioritize: false
  list:
    - name: "opencode-nemotron-ultra-free"
      label: "Nemotron 3 Ultra Free (OpenCode Zen)"
      default: true
      description: "Free OpenCode Zen model; works with the shared `public` OPENAI_API_KEY."
      preset:
        endpoint: "openAI"
        model: "nemotron-3-ultra-free"
        temperature: 0.2
        greeting: "Nemotron 3 Ultra Free preset is active via OpenCode Zen (no key required).\n"
    - name: "opencode-deepseek-flash-free"
      label: "DeepSeek V4 Flash Free (OpenCode Zen)"
      default: false
      description: "Free OpenCode Zen model; works with the shared `public` OPENAI_API_KEY."
      preset:
        endpoint: "openAI"
        model: "deepseek-v4-flash-free"
        temperature: 0.2
        greeting: "DeepSeek V4 Flash Free preset is active via OpenCode Zen (no key required).\n"
    - name: "openrouter-gemma-free"
      label: "Gemma 4 31B Free (OpenRouter)"
      default: false
      description: "Free OpenRouter model; set OPENROUTER_API_KEY (free tier works)."
      preset:
        endpoint: "OpenRouter"
        model: "google/gemma-4-31b-it:free"
        temperature: 0.2
        greeting: "Gemma 4 31B Free preset is active via OpenRouter.\n"
    - name: "google-gemini-2-5-pro"
      label: "Gemini 2.5 Pro (Vertex)"
      default: false
      description: "Google Vertex AI preset (requires ENDPOINTS to include google + GCP creds)."
      preset:
        endpoint: "google"
        model: "gemini-2.5-pro"
        temperature: 0.2
        greeting: "Gemini 2.5 Pro preset is active via Vertex AI.\n"

actions:
  allowedDomains:
    - 'opencode.ai'
    - 'librechat.ai'
