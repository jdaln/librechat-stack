# compose.hardening.yml
#
# Add this file with "-f compose.hardening.yml" to enforce runtime hardening.
# Safe defaults: read-only rootfs, drop all Linux caps, block privilege escalation,
# tmpfs for writable dirs, basic resource limits (adjust as you like).

x-harden: &harden
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 300
  ulimits:
    nofile: { soft: 1024, hard: 2048 }
  tmpfs:
    - "/tmp:size=1g"
    - "/run:size=500m"

services:
  egress-proxy:
    <<: *harden
    mem_limit: "256m"
    cpus: "0.5"
    cap_add:
      - SETGID
      - SETUID
    # Squid writes pid/cache/log files; keep them on tmpfs with a read-only rootfs.
    tmpfs:
      - "/tmp:size=256m"
      - "/run:size=64m"
      - "/var/spool/squid:rw,size=128m,uid=13,gid=13,mode=0775"
      - "/var/log/squid:rw,size=64m,uid=13,gid=13,mode=0775"

  api-proxy:
    <<: *harden
    mem_limit: "128m"
    cpus: "0.5"
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"
      - "/config:size=16m"
      - "/data:size=16m"

  api:
    <<: *harden
    mem_limit: "2g"
    cpus: "2.0"
    user: "1000:1000"   # Run as non-root; tmpfs mounts provide writable log dirs
    # re-list tmpfs so we can add the log dirs with limits (must include /tmp and /run again)
    tmpfs:
      - "/tmp:size=1g"
      - "/run:size=500m"
      - "/app/logs:rw,size=128m,uid=1000,gid=1000"
      - "/app/api/logs:rw,size=128m,uid=1000,gid=1000"
  
  sandpack:
    <<: *harden
    mem_limit: "512m"
    cpus: "0.5"
    cap_add:
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - CHOWN
    tmpfs:
      - "/tmp:size=1g"
      - "/run:size=500m"
      # Let root (pid 1) create nginx temp dirs on read-only rootfs
      - "/var/cache/nginx:rw,size=64m,uid=0,gid=0,mode=0755"
      # (Alternative: mode=0777 if you prefer keeping uid=101)

  mongodb:
    <<: *harden
    mem_limit: "2g"
    cpus: "1.5"
    # Keep default image user so entrypoint can read root-owned Docker secrets
    # (MONGO_INITDB_*_FILE) before dropping privileges.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  meilisearch:
    <<: *harden
    mem_limit: "1.5g"
    cpus: "1.0"
    # Keep default image user; forcing UID here can break first-run volume writes.

  vectordb:
    <<: *harden
    mem_limit: "2g"
    cpus: "1.5"
    # Will complain of chmod: changing permissions of '/var/run/postgresql': Operation not permitted but still runs fine
    user: "999:999"          # run as postgres user
    # (Optional explicit tmpfs for the socket/lock dir; /var/run -> /run already tmpfs via *harden)
    tmpfs:
      - "/tmp:size=1g"
      - "/run:size=500m"
      - "/var/run/postgresql:size=16m"

  rag_api:
    <<: *harden
    mem_limit: "1g"
    cpus: "1.0"
    user: "101:101"
    # keep your /tmp and /run AND make nginx cache writable & pre-owned by 101
    tmpfs:
      - "/tmp:size=1g"
      - "/run:size=500m"
      - "/var/cache/nginx:rw,size=64m,uid=101,gid=101,mode=0755"
      - "/app/uploads:rw,size=256m,uid=101,gid=101,mode=0775"

  firecrawl-api:
    <<: *harden
    mem_limit: "1.5g"
    cpus: "1.5"
    tmpfs:
      - "/tmp:size=1g"
      - "/run:size=128m"

  firecrawl-playwright:
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: "2g"
    cpus: "2.0"
    shm_size: "1g"
    tmpfs:
      - "/tmp:size=1g"
      - "/run:size=128m"

  searxng:
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    mem_limit: "512m"
    cpus: "0.75"
    tmpfs:
      - "/tmp:size=256m"
      - "/run:size=64m"

  searxng-auth:
    <<: *harden
    mem_limit: "128m"
    cpus: "0.5"
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"
      - "/config:size=16m"
      - "/data:size=16m"

  searxng-valkey:
    <<: *harden
    mem_limit: "128m"
    cpus: "0.25"
    cap_add:
      - SETGID
      - SETUID
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"

  code-interpreter-redis:
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    mem_limit: "256m"
    cpus: "0.5"
    tmpfs:
      - "/tmp:size=128m"
      - "/run:size=32m"

  code-interpreter-minio:
    <<: *harden
    mem_limit: "512m"
    cpus: "0.75"
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - "/tmp:size=256m"
      - "/run:size=64m"
      - "/root/.minio:rw,size=32m"

  jina-reranker:
    <<: *harden
    mem_limit: "1g"
    cpus: "1.0"
    tmpfs:
      - "/tmp:size=512m"
      - "/run:size=64m"
