name: Renovate

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/renovate.yml"
      - "renovate.json"
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Validate Renovate Config On Dev Push
        uses: renovatebot/github-action@e23f4d9675532445118c886434f5a34292b630b4 # v46.0.2
        with:
          configurationFile: renovate.json
          token: ${{ github.token }}
        env:
          RENOVATE_DRY_RUN: full
          RENOVATE_PLATFORM: github

  renovate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Select Renovate Auth Mode
        id: auth
        shell: bash
        run: |
          if [[ -n "$RENOVATE_TOKEN" ]]; then
            echo "mode=RENOVATE_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "mode=GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
          fi
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}

      - name: Log Renovate Auth Mode
        shell: bash
        run: |
          echo "Running Renovate with ${{ steps.auth.outputs.mode }}"
          if [[ "${{ steps.auth.outputs.mode }}" == "GITHUB_TOKEN" ]]; then
            echo "Note: GITHUB_TOKEN can be more limited than a PAT for workflow-updating PRs."
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@e23f4d9675532445118c886434f5a34292b630b4 # v46.0.2
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
        env:
          RENOVATE_PLATFORM: github
