# docker-compose.yml
#
# Goal:
# - Keep LibreChat UI/API + sandpack reachable from your Mac (127.0.0.1 only).
# - Route API/RAG outbound traffic through a domain-allowlisted Squid egress proxy.
# - Keep data services (mongodb, meilisearch, vectordb) on an INTERNAL network (no egress).
# - Avoid host bind-mounts (use named volumes).
# - Load secrets/config from .env (no mounting .env).
#
# Usage (Colima aiarm profile example):
#   docker context use colima-aiarm
#   docker compose -f docker-compose.yml -f compose.hardening.yml up -d
#   # Discover chosen host ports (dynamic publishing):
#   docker compose port api ${PORT:-3080}
#   docker compose port api-proxy 81

name: librechat-stack

networks:
  # Internal (no egress): used by DBs and internal services
  lan:
    internal: true
    ipam:
      config:
        - subnet: 172.31.10.0/24
  # Internal browser-facing API service reachable from api-proxy only.
  api_frontend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.11.0/24
  # Internal Sandpack service reachable from api-proxy only.
  sandpack_frontend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.12.0/24
  # Localhost ingress without container internet egress. Docker cannot publish
  # ports from an internal network on this stack, so keep this bridge external
  # but disable masquerading.
  ingress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.13.0/24
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  # WAN/default egress: attach ONLY the egress proxy.
  wan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.14.0/24
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  # API/RAG egress lane (internal): connects ONLY api, rag_api and egress-proxy.
  # egress-proxy is deliberately kept OFF `lan` and reached here instead, so the
  # data stores (mongodb/meilisearch/vectordb/embeddings, which stay on `lan`)
  # have NO network path to the proxy and cannot use it as an egress relay even
  # if compromised. Mirrors `search_egress` for the search tier.
  api_egress:
    internal: true
    ipam:
      config:
        - subnet: 172.31.16.0/24

volumes:
  stack_secrets:
    external: true
    name: librechat-stack_stack_secrets
  # App volumes
  lbc_api_images: {}
  lbc_api_uploads: {}
  lbc_app_logs: {}
  lbc_app_api_logs: {}
  lbc_app_data: {}
  # Datastores
  mongo_data: {}
  meili_data: {}
  pgdata2: {}

x-json-logging: &json_logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

# Egress-proxy wiring shared by api and rag_api (overlays may override NO_PROXY).
x-proxy-env: &proxy_env
  EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
  HTTP_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
  HTTPS_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
  http_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
  https_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
  # Single source of truth for NO_PROXY. Includes all hostnames that any
  # optional overlay can introduce — pre-baked here so the per-overlay
  # NO_PROXY values can't clobber each other when multiple overlays are
  # active (compose env-key merge = last-write-wins, not append).
  # Unused names when an overlay is off are harmless.
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy,code-interpreter-api,code-interpreter-proxy,searxng-auth,jina-reranker,firecrawl-api,searxng,searxng-valkey,firecrawl-redis,firecrawl-rabbitmq,firecrawl-postgres,firecrawl-playwright,embeddings,ollama-proxy}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy,code-interpreter-api,code-interpreter-proxy,searxng-auth,jina-reranker,firecrawl-api,searxng,searxng-valkey,firecrawl-redis,firecrawl-rabbitmq,firecrawl-postgres,firecrawl-playwright,embeddings,ollama-proxy}

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # Egress proxy (the only service with outbound Internet for API/RAG)
  # ──────────────────────────────────────────────────────────────────────────────
  egress-proxy:
    build:
      context: .
      dockerfile: optional/egress-proxy/Dockerfile
      args:
        EGRESS_PROXY_IMAGE: ${EGRESS_PROXY_IMAGE:-ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029}
    image: librechat-stack/egress-proxy-runtime:local
    container_name: egress-proxy
    command: ["-f", "/run/secrets/squid_conf", "-NYC"]
    networks:
      # api_egress (not lan): only api/rag_api can reach the proxy. The data
      # stores on lan must have no path to it. wan is its sole internet leg.
      - api_egress
      - wan
    volumes:
      - type: volume
        source: stack_secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: egress-proxy
    restart: always
    # Dedicated retention for the squid audit log (search-tier domains +
    # denied attempts land here): 20m × 10 = 200MB. json-file rotation is
    # size-based only; there is no time-based cap.
    logging:
      driver: json-file
      options:
        max-size: "${EGRESS_LOG_MAX_SIZE:-20m}"
        max-file: "${EGRESS_LOG_MAX_FILE:-10}"
    healthcheck:
      # Squid must accept connections; when the local-search overlay enables
      # the embedded dnsmasq resolver, its TCP listener must be up too.
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/3128 && if [ \"$${EGRESS_DNS_ENABLE:-0}\" = 1 ]; then exec 4<>/dev/tcp/$${EGRESS_DNS_LISTEN_ADDRESS:-127.0.0.1}/53; fi'"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────────────────────────────────────
  # Local API ingress proxy (host access without granting API direct WAN)
  # ──────────────────────────────────────────────────────────────────────────────
  api-proxy:
    image: caddy:2.11.3-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    container_name: api-proxy
    depends_on:
      api:
        condition: service_healthy
      sandpack:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/run/secrets/api_proxy_caddyfile", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:3081:80"
      - "127.0.0.1:80:81"
    networks:
      - api_frontend
      - sandpack_frontend
      - ingress
    volumes:
      - type: volume
        source: stack_secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: api-proxy
    restart: always
    logging: *json_logging

  # ──────────────────────────────────────────────────────────────────────────────
  # Application API (egress only via egress-proxy + local access from macOS)
  # ──────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: optional/librechat/Dockerfile
      args:
        LIBRECHAT_IMAGE: ghcr.io/danny-avila/librechat:v0.8.6@sha256:208e0f63eefd0143191768b22675d126250eb893defae2469598adb09b17e85d
    image: librechat-stack/librechat-runtime:latest
    container_name: LibreChat
    depends_on:
      mongodb:
        condition: service_healthy
      rag_api:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
      # caddy:
      #   condition: service_started
      mongo-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *proxy_env
      HOST: 0.0.0.0
      # MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      # Browser-facing Sandpack URLs returned by /api/config.
      # Keep these on localhost-reachable hosts/ports (not internal Docker DNS names).
      SANDPACK_BUNDLER_URL: ${SANDPACK_BUNDLER_URL:-http://127.0.0.1:80}
      # Static preview uses id-prefixed hostnames (id-<host>). Use a *.localhost
      # host so id-prefixed variants resolve on loopback and stay SW-secure on HTTP.
      SANDPACK_STATIC_BUNDLER_URL: ${SANDPACK_STATIC_BUNDLER_URL:-http://preview.localhost:4324}
      NODE_PATH: /app/node_modules
      NODE_OPTIONS: --require /run/secrets/undici_proxy_bootstrap.cjs
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      CONFIG_PATH: /run/secrets/librechat_yaml
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/LibreChat?authSource=LibreChat
      # env_file injects all of .env for app configuration; blank the
      # bootstrap/datastore-only credentials the app process must never hold.
      # mongo-init reads root creds from secret files, MONGO_URI above already
      # carries the scoped app user, and only rag_api talks to Postgres.
      MONGO_ROOT_USER: ""
      MONGO_ROOT_PASSWORD: ""
      MONGO_APP_USER: ""
      MONGO_APP_PASSWORD: ""
      POSTGRES_DB: ""
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
    # No host binds — use named volumes only
    volumes:
      - lbc_api_images:/app/client/public/images:ro
      - lbc_api_uploads:/app/uploads
      - lbc_app_data:/app/data
      - type: volume
        source: stack_secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: api
    networks:
      - lan          # internal comms (DBs, rag_api)
      - api_frontend
      - api_egress   # outbound via egress-proxy (egress-proxy is off `lan`)
    restart: always
    logging: *json_logging
    healthcheck:
      # GA upstream image dropped curl and ships only BusyBox wget (which
      # doesn't honor `no_proxy` env), so a wget healthcheck routes through
      # Squid and 403s. Use python3 with an empty ProxyHandler to force a
      # direct loopback call.
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request, sys; r=urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:3080/health', timeout=10); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    # If you KNOW an image is amd64-only on Apple Silicon, uncomment:
    # platform: linux/amd64

  # ──────────────────────────────────────────────────────────────────────────────
  # Sandpack bundler (internal only; host ingress is proxied via api-proxy)
  # ──────────────────────────────────────────────────────────────────────────────
  sandpack:
    image: ghcr.io/librechat-ai/codesandbox-client/bundler:20260301@sha256:82018dbc54bd2031b0cae3248dd5014e5985afb97255d1938ab38be29bc280da
    container_name: sandpack-bundler
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sandpack_frontend
    restart: always
    logging: *json_logging
    # platform: linux/amd64  # uncomment only if needed on M1

  # ──────────────────────────────────────────────────────────────────────────────
  # MongoDB (internal only)
  # ──────────────────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.2.9-noble@sha256:007773db61cb1aa44e526fb7175fc582902e67d4e6cc5f13106445767d46c818
    container_name: chat-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: LibreChat   # creates the DB at init time
    command:
      [
        "mongod",
        "--auth",
        "--bind_ip_all",
        "--quiet",
        # Slow-op log lines (default >100ms) include command filters, which
        # can carry user data; effectively disable them.
        "--slowms",
        "10000",
        "--wiredTigerCacheSizeGB",
        "0.25"
      ]
    volumes:
      - mongo_data:/data/db
      - type: volume
        source: stack_secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: mongodb
    networks: [lan]
    restart: always
    logging: *json_logging
    healthcheck:
      # Lightweight process-level readiness check. The Mongo entrypoint first
      # starts a localhost-only bootstrap server before the final auth-enabled
      # daemon, so use loopback here and let mongo-init handle cross-container
      # retrying.
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/27017'"
        ]
      interval: 10s
      timeout: 20s
      retries: 20
      start_period: 180s

  # One time side-car
  mongo-init:
    image: mongo:8.2.9-noble@sha256:007773db61cb1aa44e526fb7175fc582902e67d4e6cc5f13106445767d46c818
    container_name: mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [lan]
    restart: "no"
    logging: *json_logging
    volumes:
      - type: volume
        source: stack_secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: mongo-init
    command:
      - /bin/sh
      - -lc
      - |
        ROOT_USER="$(cat /run/secrets/mongo_root_user)"
        ROOT_PASSWORD="$(cat /run/secrets/mongo_root_password)"
        APP_USER="$(cat /run/secrets/mongo_app_user)"
        APP_PASSWORD="$(cat /run/secrets/mongo_app_password)"
        for i in $(seq 1 30); do
          if ROOT_USER="$${ROOT_USER}" ROOT_PASSWORD="$${ROOT_PASSWORD}" APP_USER="$${APP_USER}" APP_PASSWORD="$${APP_PASSWORD}" mongosh --quiet --norc "mongodb://mongodb:27017/admin" --eval "
            const rootUser = process.env.ROOT_USER;
            const rootPass = process.env.ROOT_PASSWORD;
            if (!db.auth(rootUser, rootPass)) {
              throw new Error('mongo-init auth failed');
            }
            const u = process.env.APP_USER;
            const p = process.env.APP_PASSWORD;
            const dbName = 'LibreChat';
            const d = db.getSiblingDB(dbName);
            if (!d.getUser(u)) {
              d.createUser({ user: u, pwd: p, roles: [ { role: 'readWrite', db: dbName } ] });
              print('created user ' + u);
            } else {
              d.updateUser(u, { pwd: p });
              print('user ' + u + ' already exists (password refreshed)');
            }
            quit(0);
          "; then
            exit 0
          fi
          echo "mongo-init retry $${i}/30" >&2
          sleep 2
        done;
        echo "mongo-init failed after retries" >&2
        exit 1
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Meilisearch (internal only)
  # ──────────────────────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.43.1@sha256:4407d9f9a4a5b8ef2e382827782b3dd6e0ecf8f2832ecb0344601691c13da149
    container_name: chat-meilisearch
    # No env_file: this service only needs its own key, not the full .env.
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_LOG_LEVEL: ${MEILI_LOG_LEVEL:-WARN}
    volumes:
      - meili_data:/meili_data
    networks: [lan]
    restart: always
    logging: *json_logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    # platform: linux/amd64

  # ──────────────────────────────────────────────────────────────────────────────
  # Postgres + pgvector (internal only)
  # ──────────────────────────────────────────────────────────────────────────────
  vectordb:
    image: pgvector/pgvector:0.8.2-pg15-trixie@sha256:12f07d50ce91898d11da387b519a78b0d21c767d2aa766f02ae405de6ad21c6d
    container_name: vectordb
    command: ["postgres", "-c", "listen_addresses=*"]
    # No env_file: this service only needs its own credentials, not the full .env.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks: [lan]
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5432'"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    logging: *json_logging
    # platform: linux/amd64

  # ──────────────────────────────────────────────────────────────────────────────
  # RAG API (egress only via egress-proxy)
  # ──────────────────────────────────────────────────────────────────────────────
  rag_api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.8.0@sha256:c743ffe09788c5c759ddc8e709092b34765be179a5ef4f647dc3f493e5a958e2
    container_name: rag_api
    depends_on:
      vectordb:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    # No env_file: the RAG API only needs the variables below, not the full
    # .env (Mongo credentials, Meili master key, provider keys, ...). If you
    # switch EMBEDDINGS_PROVIDER, add that provider's key here explicitly.
    environment:
      <<: *proxy_env
      # DEBUG_RAG_API: "True"
      RAG_HOST: 0.0.0.0
      DB_HOST: vectordb
      RAG_PORT: ${RAG_PORT:-8000}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-vertexai}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-004}
      PDF_EXTRACT_IMAGES: ${PDF_EXTRACT_IMAGES:-True}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp_sa}
      GOOGLE_SERVICE_KEY_FILE: ${GOOGLE_SERVICE_KEY_FILE:-/run/secrets/gcp_sa}
      GOOGLE_LOC: ${GOOGLE_LOC:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
    networks:
      - lan          # internal comms (vectordb, embeddings, api)
      - api_egress   # outbound via egress-proxy (egress-proxy is off `lan`)
    restart: always
    # platform: linux/amd64
    volumes:
      - type: volume
        source: stack_secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: rag-api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/$${RAG_PORT:-8000}; printf \"GET /health HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$${status}\" == *\" 200 \"* ]]'"
        ]
      interval: 10s
      timeout: 30s
      retries: 60
      start_period: 300s
    # to consider but in this case rag_api: and api: will need to run with the same user in harden
    logging: *json_logging
