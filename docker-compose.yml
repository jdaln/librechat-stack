# docker-compose.yml
#
# Goal:
# - Keep LibreChat UI/API + sandpack reachable from your Mac (127.0.0.1 only).
# - Route API/RAG outbound traffic through a domain-allowlisted Squid egress proxy.
# - Keep data services (mongodb, meilisearch, vectordb) on an INTERNAL network (no egress).
# - Avoid host bind-mounts (use named volumes).
# - Load secrets/config from .env (no mounting .env).
#
# Usage (Colima aiarm profile example):
#   docker context use colima-aiarm
#   docker compose -f docker-compose.yml -f compose.hardening.yml up -d
#   # Discover chosen host ports (dynamic publishing):
#   docker compose port api ${PORT:-3080}
#   docker compose port api-proxy 81

name: librechat-stack

networks:
  # Internal (no egress): used by DBs and internal services
  lan:
    internal: true
  # WAN/default egress: attach ONLY services that need internet
  wan: {}

secrets:
  gcp_sa:
    file: ./secrets/gcp-sa.json
  librechat_yaml:
    file: ./librechat.yaml
  api_proxy_caddyfile:
    file: ./optional/api-proxy/Caddyfile
  mongo_root_user:
    file: ./secrets/runtime-mongo-root-user.txt
  mongo_root_password:
    file: ./secrets/runtime-mongo-root-password.txt
  mongo_app_user:
    file: ./secrets/runtime-mongo-app-user.txt
  mongo_app_password:
    file: ./secrets/runtime-mongo-app-password.txt
  squid_conf:
    file: ./optional/egress-proxy/squid.conf
  squid_allowlist:
    file: ./optional/egress-proxy/allowed_domains.txt

volumes:
  # App volumes
  lbc_api_images: {}
  lbc_api_uploads: {}
  lbc_app_logs: {}
  lbc_app_api_logs: {}
  lbc_app_data: {}
  # Datastores
  mongo_data: {}
  meili_data: {}
  pgdata2: {}

x-json-logging: &json_logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # Egress proxy (the only service with outbound Internet for API/RAG)
  # ──────────────────────────────────────────────────────────────────────────────
  egress-proxy:
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: egress-proxy
    networks:
      - lan
      - wan
    secrets:
      - source: squid_conf
        target: /etc/squid/squid.conf
      - source: squid_allowlist
        target: /run/secrets/squid_allowlist
    restart: always
    logging: *json_logging

  # ──────────────────────────────────────────────────────────────────────────────
  # Local API ingress proxy (host access without granting API direct WAN)
  # ──────────────────────────────────────────────────────────────────────────────
  api-proxy:
    image: caddy:2.8-alpine
    container_name: api-proxy
    depends_on:
      api:
        condition: service_started
      sandpack:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:3081:80"
      - "127.0.0.1:80:81"
    networks:
      - lan
      - wan
    secrets:
      - source: api_proxy_caddyfile
        target: /etc/caddy/Caddyfile
    restart: always
    logging: *json_logging

  # ──────────────────────────────────────────────────────────────────────────────
  # Application API (egress only via egress-proxy + local access from macOS)
  # ──────────────────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/danny-avila/librechat:v0.8.2
    container_name: LibreChat
    depends_on:
      mongodb:
        condition: service_healthy
      rag_api:
        condition: service_healthy
      egress-proxy:
        condition: service_started
      # caddy:
      #   condition: service_started
      mongo-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      # MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      # Browser-facing Sandpack URLs returned by /api/config.
      # Keep these on localhost-reachable hosts/ports (not internal Docker DNS names).
      SANDPACK_BUNDLER_URL: ${SANDPACK_BUNDLER_URL:-http://127.0.0.1:80}
      # Static preview uses id-prefixed hostnames (id-<host>). Use a *.localhost
      # host so id-prefixed variants resolve on loopback and stay SW-secure on HTTP.
      SANDPACK_STATIC_BUNDLER_URL: ${SANDPACK_STATIC_BUNDLER_URL:-http://preview.localhost:4324}
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      HTTP_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      HTTPS_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      http_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      https_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      NODE_OPTIONS: --require /app/proxy-bootstrap.cjs
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy}
      CONFIG_PATH: /run/secrets/librechat_yaml
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/LibreChat?authSource=LibreChat
    # No host binds — use named volumes only
    volumes:
      - lbc_api_images:/app/client/public/images:ro
      - lbc_api_uploads:/app/uploads
      - lbc_app_data:/app/data
      - ./optional/librechat/registerSW.noop.js:/app/client/dist/registerSW.js:ro
      - ./optional/egress-proxy/undici-proxy-bootstrap.cjs:/app/proxy-bootstrap.cjs:ro
    networks:
      - lan    # internal comms (DBs, rag_api, egress-proxy)
    secrets:
      - librechat_yaml
      - gcp_sa
    restart: always
    logging: *json_logging
    # If you KNOW an image is amd64-only on Apple Silicon, uncomment:
    # platform: linux/amd64

  # ──────────────────────────────────────────────────────────────────────────────
  # Sandpack bundler (internal only; host ingress is proxied via api-proxy)
  # ──────────────────────────────────────────────────────────────────────────────
  sandpack:
    image: ghcr.io/librechat-ai/codesandbox-client/bundler:20251101
    container_name: sandpack-bundler
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lan
    restart: always
    logging: *json_logging
    # platform: linux/amd64  # uncomment only if needed on M1

  # ──────────────────────────────────────────────────────────────────────────────
  # MongoDB (internal only)
  # ──────────────────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.2-noble
    container_name: chat-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: LibreChat   # creates the DB at init time
    command: ["mongod", "--auth", "--bind_ip_all", "--quiet"]
    volumes:
      - mongo_data:/data/db
    secrets:
      - source: mongo_root_user
        target: mongo_root_user
      - source: mongo_root_password
        target: mongo_root_password
    networks: [lan]
    restart: always
    logging: *json_logging
    healthcheck:
      # Connection-level readiness check only; avoids embedding credentials
      # in the healthcheck command.
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet 127.0.0.1:27017/admin --eval \"quit(0)\" >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # One time side-car
  mongo-init:
    image: mongo:8.2-noble
    container_name: mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [lan]
    restart: "no"
    logging: *json_logging
    secrets:
      - source: mongo_root_user
        target: mongo_root_user
      - source: mongo_root_password
        target: mongo_root_password
      - source: mongo_app_user
        target: mongo_app_user
      - source: mongo_app_password
        target: mongo_app_password
    command:
      - /bin/sh
      - -lc
      - |
        ROOT_USER="$(cat /run/secrets/mongo_root_user)"
        ROOT_PASSWORD="$(cat /run/secrets/mongo_root_password)"
        APP_USER="$(cat /run/secrets/mongo_app_user)"
        APP_PASSWORD="$(cat /run/secrets/mongo_app_password)"
        for i in $(seq 1 30); do
          if ROOT_USER="$${ROOT_USER}" ROOT_PASSWORD="$${ROOT_PASSWORD}" APP_USER="$${APP_USER}" APP_PASSWORD="$${APP_PASSWORD}" mongosh "mongodb://mongodb:27017/admin" --eval "
            const rootUser = process.env.ROOT_USER;
            const rootPass = process.env.ROOT_PASSWORD;
            if (!db.auth(rootUser, rootPass)) {
              throw new Error('mongo-init auth failed');
            }
            const u = process.env.APP_USER;
            const p = process.env.APP_PASSWORD;
            const dbName = 'LibreChat';
            const d = db.getSiblingDB(dbName);
            if (!d.getUser(u)) {
              d.createUser({ user: u, pwd: p, roles: [ { role: 'readWrite', db: dbName } ] });
              print('created user ' + u);
            } else {
              d.updateUser(u, { pwd: p });
              print('user ' + u + ' already exists (password refreshed)');
            }
          "; then
            exit 0
          fi
          echo "mongo-init retry $${i}/30" >&2
          sleep 2
        done;
        echo "mongo-init failed after retries" >&2
        exit 1
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Meilisearch (internal only)
  # ──────────────────────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12.3
    container_name: chat-meilisearch
    env_file:
      - .env    # provides MEILI_MASTER_KEY
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_NO_ANALYTICS: "true"
      MEILI_LOG_LEVEL: ${MEILI_LOG_LEVEL:-WARN}
    volumes:
      - meili_data:/meili_data
    networks: [lan]
    restart: always
    logging: *json_logging
    # platform: linux/amd64

  # ──────────────────────────────────────────────────────────────────────────────
  # Postgres + pgvector (internal only)
  # ──────────────────────────────────────────────────────────────────────────────
  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    container_name: vectordb
    env_file:
      - .env
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks: [lan]
    restart: always
    logging: *json_logging
    # platform: linux/amd64

  # ──────────────────────────────────────────────────────────────────────────────
  # RAG API (egress only via egress-proxy)
  # ──────────────────────────────────────────────────────────────────────────────
  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest@sha256:201958505e21a1334234df6538713bac204b10d98a72d239b5318ce11f40f20b
    container_name: rag_api
    depends_on:
      vectordb:
        condition: service_started
      egress-proxy:
        condition: service_started
    env_file:
      - .env
    environment:
      # DEBUG_RAG_API: "True"
      RAG_HOST: 0.0.0.0
      DB_HOST: vectordb
      RAG_PORT: ${RAG_PORT:-8000}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      HTTP_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      HTTPS_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      http_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      https_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:3128}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,chat-mongodb,meilisearch,vectordb,rag_api,sandpack,sandpack-static,caddy-static-proxy,api-proxy,egress-proxy}
    networks: 
      - lan
    restart: always
    # platform: linux/amd64
    secrets:
      - gcp_sa
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sys,urllib.request; u='http://127.0.0.1:'+os.getenv('RAG_PORT','8000')+'/health'; sys.exit(0 if urllib.request.urlopen(u, timeout=2).getcode()==200 else 1)\""
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    # to consider but in this case rag_api: and api: will need to run with the same user in harden
    logging: *json_logging
